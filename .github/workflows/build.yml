name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write # create the tag and the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            PASSWORD="$SECRET_PASSWORD"
          else
            echo "::warning::Pas de secret KEYSTORE_BASE64 : clé temporaire générée, l'APK ne pourra pas mettre à jour une version installée avec une autre clé."
            PASSWORD="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias spotify-widget \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Spotify Widget" \
              -storepass "$PASSWORD" -keypass "$PASSWORD"
          fi
          echo "::add-mask::$PASSWORD"
          {
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PASSWORD=$PASSWORD"
            echo "KEY_ALIAS=spotify-widget"
            echo "KEY_PASSWORD=$PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Compute version
        env:
          VERSION_BASE: "1.0" # bump major.minor by hand; the patch is the run number
        run: |
          {
            echo "VERSION_CODE=${{ github.run_number }}"
            echo "VERSION_NAME=$VERSION_BASE.${{ github.run_number }}"
          } >> "$GITHUB_ENV"

      - run: gradle assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk "spotify-widget-$VERSION_NAME.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: spotify-widget-${{ env.VERSION_NAME }}
          path: spotify-widget-${{ env.VERSION_NAME }}.apk

      # Creates the tag v<version> on this commit, then the release with the APK attached.
      - name: Create tag and GitHub release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION_NAME" "spotify-widget-$VERSION_NAME.apk" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION_NAME" \
            --generate-notes
